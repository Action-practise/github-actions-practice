name: Sahil Pipline

on:
    push:
     branches: [prac1]

jobs:
    Checkout:
        name: Checkout Stage
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4

    Setup:
        name: Setup Stage
        runs-on: ubuntu-latest
        needs: Checkout
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4
        -   name: SetUp Python Environment
            uses: actions/setup-python@v4
            with:
                python-version: '3.12'
        -   name: Upload Code
            uses: actions/upload-artifact@v4
            with:
                name: my-app
                path: .


    UnitTest:
        name: Unit Test Stage
        runs-on: ubuntu-latest
        needs: Setup
        steps:
        -   name: Download Code
            uses: actions/download-artifact@v4
            with:
                name: my-app

        -   name: Unit Test
            run: pytest

    Deploy:
        name: Deploy Stage
        runs-on: ubuntu-latest
        needs: UnitTest
        steps:
        -   name: Download Code
            uses: actions/download-artifact@v4
            with:
                name: my-app
        -   name: SetUp Python Environment
            uses: actions/setup-python@v4
            with:
                python-version: '3.12'
        -   name: libraries Install
            run: pip install -r requirements.txt
        -   name: Deploy
            run: |
                python app.py &
                sleep 5
                echo "App Started"

