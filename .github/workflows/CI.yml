name: Sahil Pipline

on:
    push:
     branches: [prac1]

jobs:
    Checkout:
        name: Checkout Stage
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4

    Docker_Deploy:
        runs-on: self-hosted
        needs: Checkout
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4

        -   name: Docker Login
            uses: docker/login-action@v4
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

        -   name: Docker Build & Push
            uses: docker/build-push-action@v7
            with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}
        - name: Create .env file
          run: |
            echo "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}" > .env


        -   name: Pull Latest Image
            run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}

        -   name: Docker-Compose Deploy
            run: docker compose down || true
                docker compose up -d
        -   name: Deployment Status
            run: echo "✅ Deployed with Docker Compose using image ${{ github.sha }}"             
                