name: Sahil Pipline

on:
    push:
     branches: [prac1]

jobs:
    Checkout:
        name: Checkout Stage
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4

    Setup:
        name: Setup Stage
        runs-on: ubuntu-latest
        needs: Checkout
        steps:
        -   name: Checkout Code
            uses: actions/checkout@v4
        -   name: SetUp Python Environment
            uses: actions/setup-python@v4
            with:
                python-version: '3.12'
        -   name: Upload Code
            uses: actions/upload-artifact@v4
            with:
                name: my-app
                path: .


    UnitTest:
        name: Unit Test Stage
        runs-on: ubuntu-latest
        needs: Setup
        steps:
        -   name: Download Code
            uses: actions/download-artifact@v4
            with:
                name: my-app

        -   name: Unit Test
            run: echo "Test Complete"


    Docker_Deploy:
        runs-on: ubuntu-latest
        needs: UnitTest
        steps:
        -   name: Download Code
            uses: actions/download-artifact@v4
            with:
                name: my-app

        -   name: Docker Setup
            uses: docker/setup-buildx-action@v4

        -   name: Docker Login
            uses: docker/login-action@v4
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

        -   name: Docker Build & Push
            uses: docker/build-push-action@v7
            with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}
        - name: Create .env file
            run: |
                echo "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}" > .env


        -   name: Pull Latest Image
            run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gitaction_test:${{ github.sha }}

        -   name: Docker-Compose Deploy
            run: docker compose down && docker compose up -d
        -   name: Deployment Status
            run: echo "✅ Deployed with Docker Compose using image ${{ github.sha }}"             
                